  <g font-family="sans-serif">
    <text x="48" y="816" fill="#F8F8F2" font-size="20" font-weight="600">Family grammar</text>
    <text x="48" y="850" fill="#F8F8F2" fill-opacity=".72" font-size="17">Dark foundation · near-white semantic notch · one dominant accent · one supporting plane</text>
    <text x="48" y="880" fill="#F8F8F2" fill-opacity=".72" font-size="17">Zed is angular and editor-like. Warp is directional and flowing. Both remain distinct without color.</text>
    <text x="48" y="932" fill="#6272A4" font-size="14">1024-unit vector masters · explicit 32 px / 16 px variants · original silhouettes · no upstream marks</text>
    <text x="1552" y="932" text-anchor="end" fill="#6272A4" font-size="14">Dracula Prism icon system</text>
  </g>
