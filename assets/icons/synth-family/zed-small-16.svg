<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Zed — 16 px simplification</title>
  <desc id="description">Bold Z reduction of the labyrinth. Horizontal bars snap to a 64-unit grid so they land on whole pixels at 16 px.</desc>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="#101014"/>
  </g>
  <g id="glyph" fill="#A9B7C6">
      <path d="M 192,256 H 832 V 320 L 464,704 H 832 V 768 H 192 V 704 L 600,320 H 192 Z"/>
  </g>
</svg>
